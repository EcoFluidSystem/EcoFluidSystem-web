<style>

  /* HERO - MEJORADO RESPONSIVE */
#hero, .hero {

.hero-content { max-width: 680px; position: relative; z-index: 3; animation: floatUp .8s ease both; width: 100%; }

}

.hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-hero-primary {

.btn-hero-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(52,168,83,.6); }
.btn-hero-outline {

}

/* HERO STATS - MEJORADO PARA NO SUPERPONERSE */

.stat-card {

  .hero-img-upload-btn {

  .section-pad { padding: 5rem 2rem; }
  .container { max-width: 1200px; margin: 0 auto; }
  .section-eyebrow {

  .section-title {

  /* PRODUCTS */
  #products { background: #fff; }

  .product-body h3 { font-size: 1.15rem; font-weight: 800; color: #15395E; margin-bottom: .3rem; }

  .ficha-tecnica-link {

  /* STATS BAR */
  .stats-bar {

  .stat-item { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 1.8rem 1.2rem; text-align: center; transition: all .25s; }
  .stat-item:hover { background: rgba(52,168,83,.18); transform: translateY(-4px); }

  .stat-item span { font-size: .78rem; color: rgba(255,255,255,.75); line-height: 1.4; display: block; }

  /* RESULTS */
  #results { background: #f2f7f3; }
  .accordion-item {
    background: #fff; border-radius: 16px;
    border: 1px solid #D7EAF7;
    overflow: hidden; transition: all .3s;
    margin-bottom: 1.5rem;
  }
  .accordion-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.5rem 2rem; cursor: pointer; user-select: none;
    transition: all .2s;
  }
  .accordion-item.active .accordion-header {
    background: linear-gradient(135deg, #f0f7ff 0%, #f0fff4 100%);
    border-bottom: 1px solid #34A853;
  }
  .accordion-header:hover { background: #f9fbfd; }
  .accordion-title {
    font-size: 1.1rem; font-weight: 800; color: #15395E;
    display: flex; align-items: center; gap: .8rem;

  .accordion-body { padding: 2rem; }

  .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2rem; margin-top: .8rem; }

    position: relative; overflow: hidden; border-radius: 12px;

  .video-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(52,168,83,.2); }
  .video-placeholder {

    flex-direction: column; gap: .8rem; color: #34A853; position: relative;
  }
  .video-placeholder .material-symbols-outlined { font-size: 3rem; opacity: .6; }
  .video-placeholder p { font-size: .82rem; font-weight: 600; text-align: center; margin: 0; color: #2E5475; }
  .video-placeholder span.sub { font-size: .68rem; opacity: .65; }
  .video-file-input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  /* MAP */
  #map-section { background: #fff; }
  .map-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; margin-top: 2rem; }
  #map { height: 450px; border-radius: 16px; box-shadow: 0 12px 48px rgba(21,57,94,.16); }

  .map-info p { font-size: .95rem; color: #2E5475; line-height: 1.8; margin-bottom: 1.5rem; }
